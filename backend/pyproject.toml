[project]
name = "rag-knowledge"
version = "0.1.0"
description = "企业级混合检索 RAG 知识问答平台"
authors = [{name = "Team", email = "team@example.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # FastAPI and extensions
    "fastapi>=0.109.0",
    "fastapi-users>=12.1.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.3",
    "psycopg2-binary>=2.9.9",

    # Redis and Celery
    "redis>=5.0.0",
    "celery>=5.3.0",
    "httpx>=0.26.0",

    # Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # File handling
    "python-magic>=0.4.27",
    "aiofiles>=23.2.0",

    # OpenSearch
    "opensearch-py>=2.4.0",

    # AI/ML
    "openai>=1.12.0",
    "tiktoken>=0.5.0",
    "numpy>=1.26.0",

    # Logging and monitoring
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",

    # Utils
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.8.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "faker>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

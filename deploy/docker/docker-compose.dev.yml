# 开发环境 Docker Compose
services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres-dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-rag_knowledge}
      POSTGRES_USER: ${DATABASE_USER:-rag_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-rag_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-rag_user} -d ${DATABASE_NAME:-rag_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-dev-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: rag-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-dev-network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: rag-minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-dev-network

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: rag-opensearch-dev
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      plugins.security.disabled: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_dev_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-dev-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - rag-dev-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana-dev
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - rag-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  opensearch_dev_data:
  prometheus_dev_data:
  grafana_dev_data:

networks:
  rag-dev-network:
    driver: bridge
